name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release tag and working tree
        run: |
          test "$(git describe --tags --exact-match)" = "$GITHUB_REF_NAME"
          test -z "$(git status --porcelain)"
      - name: Build and test release files
        run: >-
          docker build --platform linux/amd64 --target artifacts --progress=plain
          --output type=local,dest=build/release .
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/release/tlmframe-linux-x86_64 \
            build/release/tlmframe-linux-aarch64 \
            build/release/SHA256SUMS \
            build/release/BUILDINFO.txt \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
